apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# Recommended labels shared by every resource (not added to selectors,
# because Deployment selectors cannot be changed after creation)
labels:
  - pairs:
      app.kubernetes.io/part-of: webapp
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true
configMapGenerator:
  - name: web-content
    files:
      - index.html
