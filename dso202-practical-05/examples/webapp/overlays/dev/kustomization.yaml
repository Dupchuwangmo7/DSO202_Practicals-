apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-dev
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: webapp
    count: 1
images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.27-alpine
configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html
